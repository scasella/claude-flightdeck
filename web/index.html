<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flightdeck</title>
<style>
:root{
  --bg:#0c0c0c; --text:#e8e8e8; --dim:#9a9a9a; --faint:#7a7a7a; --track:#585858;
  --main:#d97757; --agent:#8f9cf7; --gate:#4eba65; --cleared:#b1b9f9;
  --arch:#af87ff; --amber:#ffc107; --warn:#ff6b80;
  --ch:1ch;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:18px/1.3 "Cascadia Mono","Cascadia Code",Consolas,monospace;font-variant-numeric:tabular-nums;padding:16px}
::selection{background:var(--agent);color:var(--bg)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--faint)}
.pane{max-width:1800px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(36ch,1fr) minmax(48ch,2fr) minmax(36ch,1.3fr);gap:0 2ch;align-items:start}
@media (max-width:1500px){.grid{grid-template-columns:minmax(36ch,1fr) minmax(0,2fr)}.col3{grid-column:1/-1}}
@media (max-width:900px){.grid{grid-template-columns:1fr}.grid.flat{display:flex!important;flex-direction:column}.grid.flat>*{overflow:visible!important;min-height:auto}.fill{min-height:8em}.topbar{flex-wrap:wrap}}
.col{min-width:0;display:flex;flex-direction:column;min-height:0}
html,body{height:100%}
body{display:flex;flex-direction:column;box-sizing:border-box}
.pane{flex:1;display:flex;flex-direction:column;min-height:0;width:100%}
.grid{flex:1;align-items:stretch;min-height:0}
.fill{flex:1;min-height:12em;overflow:auto;display:flex;flex-direction:column}
.fill>*{flex:none}.fill>.wrap{flex:none}
.topbar{display:flex;justify-content:flex-end;gap:1ch;max-width:1800px;width:100%;margin:0 auto}
.topbar button{background:none;border:0;color:var(--dim);font:inherit;cursor:pointer;padding:0 .5ch}.topbar button:hover{color:var(--text)}#themeName{cursor:pointer;color:var(--dim);text-align:center}#themeFind{width:24ch;background:var(--bg);color:var(--text);border:1px solid var(--faint);font:inherit}
.topbar label{color:var(--dim)}.tpick{position:relative}.tlist{position:absolute;right:0;top:1.6em;z-index:9;width:30ch;max-height:60vh;overflow:auto;background:var(--bg);border:1px solid var(--agent);padding:.2em 0}.tlist div{padding:0 1ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--dim)}.tlist div.on{background:var(--agent);color:var(--bg)}.tlist div.cur{color:var(--text);font-weight:700}.tlist .none{cursor:default}
.mainband{}

.meters{display:grid;gap:.2em 0}
.meter .row{overflow:visible}.meter .gwrap{overflow:hidden;white-space:nowrap;font-size:1.1em}
.facts{display:flex;flex-wrap:wrap;gap:0 2ch;margin-top:.2em}
.bignum{}
@media (max-width:900px){.meters{grid-template-columns:1fr}}
.agents{line-height:1.4}
.agents .lbl{flex-basis:40ch}
.small{max-height:11em;overflow:auto;font-size:.9em;flex:none}
.lbl{flex:0 0 44ch}
.lane .bar{flex:1;overflow:hidden}
.log .row .r{margin-left:0;flex:1}
.hd{text-align:center;margin-bottom:.4em}
.hd b{font-weight:700}
.box{border:1px solid currentColor;border-radius:6px;padding:.15em 1ch;margin:.6em 0}
.box>*{color:var(--text)}
.row{display:flex;gap:1ch;white-space:nowrap;overflow:hidden}
.row .r{margin-left:auto}
.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{white-space:pre-wrap;word-break:break-all}
.dim{color:var(--dim)}.faint{color:var(--faint)}.track{color:var(--track)}.pulse{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
/* Theme switch: colours crossfade rather than snap. */
body,body *{transition:color .2s ease-out,background-color .2s ease-out,border-color .2s ease-out}
.live{margin-left:1ch}.sel{color:var(--agent)}.b{font-weight:700}
.c-main{color:var(--main)}.c-agent{color:var(--agent)}.c-gate{color:var(--gate)}
.c-cleared{color:var(--cleared)}.c-arch{color:var(--arch)}.c-amber{color:var(--amber)}.c-warn{color:var(--warn)}
.sec{margin:.6em 0 .1em}
.lane{cursor:pointer}.lane:hover .lbl{text-decoration:underline}
.lane:focus-visible,.key:focus-visible{outline:1px solid var(--agent)}
.bar{letter-spacing:0}
.foot{margin-top:1em;text-align:center}

/* Layout variants (?layout=2..10). Areas: main gate agents card loops log. */
.grid.flat{display:grid;gap:.6em 2ch;align-items:stretch}
.grid.flat>*{min-height:0;overflow:hidden}.grid.flat .box{margin:0}.grid.flat .fill{min-height:0;flex:1;overflow:auto}
.a-main{grid-area:main}.a-gate{grid-area:gate}.a-agents{grid-area:agents}.a-card{grid-area:card}.a-loops{grid-area:loops}.a-log{grid-area:log}
.a-agents>.agents{overflow:auto}
[data-layout="2"] .flat{grid-template:"agents agents agents" 1.4fr "main gate log" 1fr "card card loops" auto/1fr 1fr 1.2fr}
[data-layout="3"] .flat{grid-template:"main agents" auto "gate agents" 1fr "gate card" 1fr "gate log" 1fr "loops log" auto/40ch 1fr}
[data-layout="4"] .flat{grid-template:"main main" auto "agents card" 1fr "log log" 1fr "gate loops" auto/1.6fr 1fr}
[data-layout="5"] .flat{grid-template:"main agents" 1fr "gate card" 1fr "loops log" auto/1fr 1fr}
[data-layout="5"] .flat>*{border:1px solid var(--faint);padding:.3em 1ch}
[data-layout="6"] .pane{max-width:100ch}
[data-layout="6"] .flat{grid-template:"main" auto "gate" auto "agents" auto "card" auto "loops" auto "log" 1fr/1fr}
[data-layout="7"] .flat{grid-template:"agents log main" auto "agents log gate" 1fr "card log loops" auto/1fr 1.6fr 40ch}
[data-layout="8"] body,[data-layout="8"]{font-size:15px}
[data-layout="8"] .flat{grid-template:"main agents agents log" 1fr "gate card loops log" 1fr/1fr 1fr 1fr 1fr}
[data-layout="9"] .flat{grid-template:"main main main" auto "agents agents gate" 1fr "card log log" 1fr "loops loops loops" auto/1fr 1fr 44ch}
[data-layout="9"] .a-main .meters{grid-template-columns:repeat(3,1fr);gap:0 4ch}
[data-layout="9"] .a-main .box{display:flex;flex-wrap:wrap;gap:0 4ch;align-items:center}
[data-layout="10"] .flat{grid-template:"agents card" minmax(0,1fr) "loops card" auto "main gate" auto "main log" 8em/56ch 1fr}[data-layout="10"] .agents .lbl{flex-basis:32ch}
.focus{font-size:1.1em;display:flex;flex-direction:column;gap:.35em}
.focus .ftitle{font-size:1.2em}
.fmeta{display:flex;flex-wrap:wrap;gap:0 3ch}
.ftrack{overflow:hidden;white-space:nowrap;font-size:1.2em}
.fcols{display:grid;grid-template-columns:minmax(0,1fr) 18ch;gap:0 3ch;min-height:0}
.fanswer{border-left:1px solid var(--faint);padding-left:1ch;color:var(--text)}
@media (max-width:900px){html,body{height:auto}.pane,.grid.flat{flex:none;height:auto}.grid.flat>*{flex:none;height:auto;min-height:0}.grid.flat .fill{flex:none;max-height:none;overflow:visible}.grid.flat .box{margin:0 0 .6em}}
</style>
</head>

<script>

function gateCard(){

function lanes(){

    var r=add(el("div","row lane"),span(stColor[c.state]+(c.state==="running"?" spin":""),stMark[c.state]),add(span("t lbl "+(view.card===i?"b":"")),span(view.card===i?"sel b":"faint",view.card===i?"> ":"  "),(i+1)+": "+c.label),

function tail(){

var lastOk=0;
function liveTag(){var t=span("live t");t.id="liveTag";paintLive(t);return t}

// agent's mark flashes once, new log lines arrive tinted. The first render stays still.
var CALM=matchMedia("(prefers-reduced-motion: reduce)");

  });

}
function renderPane(p){

  add(p,add(el("div","hd"),add(el("div"),span("b","FLIGHTDECK \u00b7 "),span("c-main b",S.model.toUpperCase()),span("b"," "+S.status.toUpperCase()),liveTag()),
    add(el("div"),span("c-main","\u25a0"),span("dim"," main  "),span("c-agent","\u25a0"),span("dim"," agents  "),span("c-gate","\u25a0"),span("dim"," gate"))));
  var foot=el("div","foot faint","1-6 expand \u00b7 f/s/o gate rows \u00b7 t theme \u00b7 esc back");
  var ex=expanded()||add(el("div","box faint"),"press 1-6 to open an agent");
  var ag=add(el("section","box c-agent agents fill"),lanes());
  if(LAYOUT>1){
    // Flat grid: each block is a named area; body[data-layout] picks the arrangement.
    var fg=el("div","grid flat");
    var tl=tail(),loops=el("div","a-loops");loops.appendChild(tl.firstChild);loops.appendChild(tl.firstChild);
    var log=el("div","a-log col");log.appendChild(tl.firstChild);log.firstChild.classList.add("fill");
    function area(n,node){var w=el("div","a-"+n+" col");w.appendChild(node);return w}
    ex.classList.add("fill");
    add(fg,area("main",mainCard()),area("gate",gateCard()),area("agents",ag),area("card",ex),loops,log);
    add(p,fg,foot);return;
  }
  var g=el("div","grid"),c1=el("div","col"),c2=el("div","col"),c3=el("div","col col3");
  add(c1,mainCard());
  add(c1,gateCard());
  ex.classList.add("small");
  add(c2,ag,ex);
  add(c3,tail());

}
function toggleCard(i){view.card=view.card===i?null:i;render()}
function toggleGate(g){view.gate=view.gate===g?null:g;render()}
document.addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(/^[1-6]$/.test(e.key)&&S.agents[+e.key-1])toggleCard(+e.key-1);
  else if("fso".indexOf(e.key)>=0&&e.key.length===1)toggleGate(e.key);
  else if(LAYOUT===10&&(e.key==="["||e.key==="]")&&S.agents.length){view.card=((view.card||0)+(e.key==="]"?1:-1)+S.agents.length)%S.agents.length;render()}
  else if(e.key==="Escape"){view.card=null;view.gate=null;render()}
});
function load(){
  // From disk the plugin's feed is state.js (fetch is blocked on file://): reload it as a script each poll.
  if(location.protocol==="file:"){
    var old=document.getElementById("feed");if(old)old.remove();
    var s=document.createElement("script");s.id="feed";s.src="state.js?"+Date.now();
    s.onload=function(){if(window.FD_STATE){S=window.FD_STATE;window.FD_STATE=null;lastOk=Date.now();render()}};
    s.onerror=function(){};document.head.appendChild(s);return;
  }
  fetch("state.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d){S=d;lastOk=Date.now();render()}}).catch(function(){});
}
// Themes: "Claude" (the pane's own colours) plus Tabby community schemes (MIT, schemes.js).
// Scheme array: [bg, fg, color0..color15]; roles map onto ANSI slots the way terminals tint them.
var ROOT=document.documentElement, ROLE_DEFAULTS={};
["bg","text","dim","faint","track","main","agent","gate","cleared","arch","amber","warn"].forEach(function(v){ROLE_DEFAULTS[v]=getComputedStyle(ROOT).getPropertyValue("--"+v).trim()});
function applyTheme(name){
  var s=(window.TABBY_SCHEMES||{})[name];
  var m=s?balance({bg:s[0],text:s[1],dim:s[9]===s[1]?s[8]:mix(s[1],s[0]),faint:s[10],track:s[10],main:s[5],agent:s[6],gate:s[4],cleared:s[14],arch:s[7],amber:s[13],warn:s[3]},s.slice(2)):ROLE_DEFAULTS;
  Object.keys(m).forEach(function(k){ROOT.style.setProperty("--"+k,m[k])});
  try{localStorage.setItem("fd-theme",name)}catch(e){}
}
function lum(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ratio(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
// Community schemes were made for terminals, not for this page: every role gets a contrast band
// on the background so text stays readable, dim stays above faint, and lanes stay apart.
var LANES=["main","agent","gate","arch","warn"];
function balance(m,ansi){
  var bg=m.bg;
  m.text=fit(m.text,bg,7,16);
  m.dim=fit(m.dim,bg,6,Math.max(6,ratio(m.text,bg)/1.15));
  m.faint=fit(m.faint,bg,4.5,ratio(m.dim,bg)/1.2);
  m.track=fit(m.track,bg,1.8,2.5);
  ["main","agent","gate","cleared","arch","amber","warn"].forEach(function(k){m[k]=fit(m[k],bg,4.5,21)});
  separate(m,ansi);
  return m;
}
// Moves c toward the far end (white or black) to reach lo, or toward bg to come down to hi.
function fit(c,bg,lo,hi){
  var r=ratio(c,bg);if(r>=lo&&r<=hi)return c;
  var end=r<lo?(ratio("#ffffff",bg)>ratio("#000000",bg)?"#ffffff":"#000000"):bg,goal=r<lo?lo:hi,a=0,b=1;
  for(var i=0;i<14;i++){var w=(a+b)/2;if((ratio(mixw(end,c,w),bg)<goal)===(r<lo))a=w;else b=w}
  return mixw(end,c,b);
}
function dist(a,b){return Math.hypot.apply(null,[1,3,5].map(function(i){return parseInt(a.substr(i,2),16)-parseInt(b.substr(i,2),16)}))}
// A lane too close to an earlier one takes the first ANSI colour that is far from all of them.
function separate(m,ansi){
  LANES.forEach(function(k,i){
    var prev=LANES.slice(0,i).map(function(p){return m[p]}),far=function(c){return prev.every(function(p){return dist(p,c)>=60})};
    if(far(m[k]))return;
    var pick=ansi.concat(["#e05050","#40c060","#5080ff","#e0c040","#d050d0","#40c0d0"]).map(function(c){return fit(c,m.bg,4.5,21)}).filter(far)[0];
    if(pick)m[k]=pick;
  });
}
function mixw(a,b,w){var p=function(h,i){return parseInt(h.substr(1+i*2,2),16)};var o="#";for(var i=0;i<3;i++){o+=("0"+Math.round(p(a,i)*w+p(b,i)*(1-w)).toString(16)).slice(-2)}return o}
function mix(a,b){var p=function(h,i){return parseInt(h.substr(1+i*2,2),16)};var o="#";for(var i=0;i<3;i++){o+=("0"+Math.round(p(a,i)*.62+p(b,i)*.38).toString(16)).slice(-2)}return o}
(function(){
  // Terminal-style picker: [<] name [>] , t / T cycle, click the name to search.
  var names=["Claude"].concat(Object.keys(window.TABBY_SCHEMES||{})),cur=0;
  var nameEl=document.getElementById("themeName"),inp=document.getElementById("themeFind"),dl=document.getElementById("themeList");

  function set(i){cur=(i+names.length)%names.length;nameEl.textContent=names[cur];applyTheme(names[cur])}
  var saved="Claude";try{saved=localStorage.getItem("fd-theme")||"Claude"}catch(e){}
  var q=new URLSearchParams(location.search).get("theme");if(q)saved=q;
  set(Math.max(0,names.indexOf(saved)));
  document.getElementById("themePrev").onclick=function(){set(cur-1)};
  document.getElementById("themeNext").onclick=function(){set(cur+1)};
  // Own list instead of <datalist>: themed, keyboard driven, previews on hover.
  var hits=[],hi=0,before=0;
  function fill(){var q=inp.value.toLowerCase();hits=names.map(function(n,i){return i}).filter(function(i){return names[i].toLowerCase().indexOf(q)>=0});
    hi=Math.max(0,Math.min(hi,hits.length-1));dl.textContent="";
    if(!hits.length){dl.appendChild(el("div","none faint","no match"));return}
    hits.forEach(function(ix,j){var d=el("div",(j===hi?"on ":"")+(ix===before?"cur":""),names[ix]);d.setAttribute("role","option");
      d.onmousedown=function(e){e.preventDefault();close(ix)};d.onmouseenter=function(){hi=j;mark();applyTheme(names[ix])};dl.appendChild(d)})}
  function mark(){Array.prototype.forEach.call(dl.children,function(d,j){d.classList.toggle("on",j===hi)});var c=dl.children[hi];if(c)c.scrollIntoView({block:"nearest"})}
  function open(){before=cur;nameEl.hidden=true;inp.hidden=false;dl.hidden=false;inp.value="";hi=Math.max(0,before);fill();mark();inp.focus()}
  function close(pick){inp.hidden=true;dl.hidden=true;nameEl.hidden=false;set(pick==null?before:pick)}
  nameEl.onclick=open;
  inp.oninput=function(){hi=0;fill();if(hits.length)applyTheme(names[hits[0]])};
  inp.onblur=function(){if(!inp.hidden)close(null)};
  inp.onkeydown=function(e){e.stopPropagation();
    if(e.key==="Escape"){e.preventDefault();close(null)}
    else if(e.key==="Enter"){e.preventDefault();close(hits.length?hits[hi]:null)}
    else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!hits.length)return;hi=(hi+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length;mark();applyTheme(names[hits[hi]])}};
  document.addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==="t")set(cur+1);else if(e.key==="T")set(cur-1)});
})();
S=JSON.parse(document.getElementById("sample").textContent);
var q=new URLSearchParams(location.search);
if(q.get("state")==="empty"){S.agents=[];S.earlier=0}
if(q.get("card"))view.card=+q.get("card")-1;

setInterval(function(){spinI=(spinI+1)%SPIN.length;document.querySelectorAll(".spin").forEach(function(e){e.textContent=SPIN[spinI]})},120);
